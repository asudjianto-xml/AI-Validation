[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiv"
version = "0.1.0"
description = "AI for Validation: general-purpose model and GenAI validation tooling (weak-region discovery, KG-grounded RAG, and more)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Agus Sudjianto" },
    { name = "Gary Ang" },
    { name = "Yu Pan" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xgboost",
]

[project.optional-dependencies]
# The chapter companion notebooks. Chapter 3 refits the auxiliary error model and
# compares its trees with the saved model; that comparison holds for XGBoost 3.4,
# which requires Python 3.12 or later.
notebooks = [
    "xgboost>=3.4",
    "matplotlib",
    "joblib",
    "ipykernel",
]
# aiv.kg_rag and aiv.report retrieval through a GMS store.
kg = ["knowlytix"]
# The phi_p design optimizer and the aiv.moegp experts.
torch = ["torch"]

[project.scripts]
aiv-companions = "aiv.companions:main"

[tool.setuptools.packages.find]
include = ["aiv*"]

[tool.setuptools.package-data]
# Evidence, helper modules and notebooks read by the companion notebooks.
"aiv.companions" = ["_data/**/*"]
